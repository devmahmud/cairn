# Cairn — LiteLLM proxy config (BLUEPRINT.md §1, §3.13, §8 step 9).
#
# Loaded by `docker-compose.litellm.yml`'s `litellm` service. Point the
# app's `OPENAI_BASE_URL` at this proxy (`http://localhost:4000` from the
# host, `http://litellm:4000` from another compose service) to get
# per-key budgets, RPM/TPM limits, fallback/retry, and Prometheus metrics
# in front of whichever upstream model(s) you list here -- zero app code,
# per `get_llm()`'s `OPENAI_BASE_URL` swap-point (§3.6).
#
# `model_name` is what callers (this app's `OPENAI_MODEL`/`EMBEDDING_MODEL`
# settings) request; `litellm_params.model` is the real upstream, prefixed
# with its provider (`openai/`, `ollama/`, ...). Edit/extend this list per
# client (`client.config.yaml`'s `llm.model`) -- nothing here is meant to
# ship unedited to a real deployment.

model_list:
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  # Self-hosted embeddings (§3.8) -- point `api_base` at your own
  # vLLM/TEI/Ollama endpoint serving Qwen3-Embedding-0.6B; commented out
  # since it has no working default without a self-hosted endpoint URL.
  # - model_name: Qwen3-Embedding-0.6B
  #   litellm_params:
  #     model: openai/Qwen3-Embedding-0.6B
  #     api_base: http://host.docker.internal:8080/v1
  #     api_key: "not-needed"

litellm_settings:
  drop_params: true        # tolerate provider-specific param mismatches instead of erroring
  set_verbose: false
  num_retries: 3
  request_timeout: 90

router_settings:
  routing_strategy: usage-based-routing-v2
  allowed_fails: 3
  cooldown_time: 30        # seconds a model is skipped after repeated failures (429 backoff, §3.13)

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL   # virtual keys + spend tracking persistence (this proxy's own DB, not the app's)
  # Example per-client budget/rate-limit shape (documented, not wired to a
  # real key here -- create real virtual keys via the proxy's `/key/generate`
  # admin API or UI once `master_key` is set to a real secret):
  #   max_budget: 100          # USD, resets on `budget_duration`
  #   budget_duration: 30d
  #   rpm_limit: 60
  #   tpm_limit: 100000
