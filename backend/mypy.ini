# Cairn backend — mypy config (BLUEPRINT.md §1, §8 step 2).
# Strict-ish: real type safety on first-party code without fighting every
# third-party package that ships partial or no stubs.

[mypy]
python_version = 3.13
mypy_path = src
explicit_package_bases = True
namespace_packages = True

warn_return_any = True
warn_unused_configs = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
strict_equality = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = False

show_error_codes = True
pretty = True

exclude = (?x)(
    ^alembic/versions/
    | ^\.venv/
  )

# Third-party packages without (complete) type stubs at time of writing.
[mypy-dependency_injector.*]
ignore_missing_imports = True

[mypy-langgraph.checkpoint.postgres.*]
ignore_missing_imports = True

[mypy-slowapi.*]
ignore_missing_imports = True

[mypy-passlib.*]
ignore_missing_imports = True
