[project]
name = "cairn-backend"
version = "0.1.0"
description = "Cairn backend — FastAPI + LangGraph agent-chat service (BLUEPRINT.md)."
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "dependency-injector>=4.49.1",
    "fastapi[standard]>=0.141.1",
    "fastapi-users[sqlalchemy]>=15.0.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langchain>=1.3.15",
    "langchain-openai>=1.5.1",
    "langchain-text-splitters>=1.1.2",
    "langfuse>=4.14.4",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "pgvector>=0.5.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.0.52",
    "structlog>=26.1.0",
    "tiktoken>=0.13.0",
    "watchfiles>=1.2.0",
    "cryptography>=50.0.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.21.0",
    "asgi-lifespan>=2.1.0",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
    "types-pyyaml>=6.0.12.20260815",
]
# Real Presidio-backed PII redaction (BLUEPRINT.md §3.12) -- NOT installed
# by default (offline-first, design principle #4: this template boots and
# its test suite runs with zero guardrail credentials/model downloads).
# `uv sync --group guardrails` before setting `GUARDRAILS_ENABLED=true` in
# any environment that needs real PII redaction; without it,
# `core/guardrails/pii.py` degrades to a loud no-op rather than crashing a
# turn (guardrails are one defense-in-depth layer among several, not the
# only one).
guardrails = [
    "presidio-analyzer>=2.2.360",
    "presidio-anonymizer>=2.2.360",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "eval: LLM-judged evaluation scenarios (cost-incurring, skipped by default; see BLUEPRINT.md §3.11)",
    "integration: needs a real Postgres/Redis via docker-compose (BLUEPRINT.md §3.11)",
]
addopts = "-m 'not eval'"
testpaths = ["tests"]
