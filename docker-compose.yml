# Cairn — lean local stack (BLUEPRINT.md §5, §8 step 9).
#
# `db` + `redis` + `backend` + `frontend`, wired with real healthchecks so
# `docker compose up` comes up in the right order on a cold start: `backend`
# waits for `db`/`redis` to report *healthy* (not just "container started"),
# and its own image entrypoint (`backend/docker-entrypoint.sh`) runs
# `alembic upgrade head` before starting uvicorn -- a fresh `docker compose
# up` on an empty Postgres volume ends up with a working schema, never a
# manual migrate step.
#
# Copy `.env.example` to `.env` first (both `env_file:` below and Compose's
# own `${VAR}` interpolation -- e.g. `VITE_API_BASE_URL` in `frontend`'s
# build args -- read the same root `.env`). Intentionally light by default
# (BLUEPRINT.md §5): `STREAM_DURABLE`, `GUARDRAILS_ENABLED`, and
# `LANGFUSE_ENABLED` all default off in `.env.example`, so this compose file
# alone boots a working chat app with no external credentials. `redis` is
# still started here (it backs rate limiting/caching even with durable
# streaming off) -- `DATABASE_URL`/`REDIS_URL` are overridden below to point
# at the in-network service names instead of `.env.example`'s
# `localhost`-oriented defaults, which are correct for `make run` (bare
# `fastapi dev` against `make up`'s exposed ports) but not for a container
# resolving another container by DNS name.
#
# Opt-in add-ons (heavier, not part of the default `make up`):
# `docker-compose.langfuse.yml` (observability), `docker-compose.litellm.yml`
# (LLM gateway) -- `make up-langfuse` / `make up-litellm`.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    build: ./backend
    env_file: .env
    environment:
      # Overrides `.env.example`'s `localhost`-oriented defaults with this
      # compose network's service DNS names -- everything else (LLM/
      # retrieval/guardrails/limits/auth knobs) still comes from `.env`.
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/app
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      # No curl/wget in the `python:3.13-slim` runtime image (BLUEPRINT.md
      # §6's "no build toolchain" goal for the final image) -- `urllib` is
      # stdlib, so this needs no extra package just to probe liveness.
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request as u; u.urlopen('http://localhost:8000/health/live', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  pgdata:
