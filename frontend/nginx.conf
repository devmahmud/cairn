# Cairn frontend — nginx SPA serving (BLUEPRINT.md §5, §8 step 8).
#
# The frontend talks to the backend directly over its own origin
# (`VITE_API_BASE_URL`, CORS-mediated — `CORS_ALLOW_ORIGINS` on the backend
# side, §3.9) rather than through an nginx reverse-proxy path, so this is
# static-SPA serving only: gzip, long-cache the hashed `assets/` bundle,
# never cache `index.html`, and fall back to it for any unknown path so
# client-side routing (`react-router`, `app/router.tsx`) owns 404s instead
# of nginx.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
