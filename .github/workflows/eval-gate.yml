# Cairn — prompt/behavior regression gate (BLUEPRINT.md §3.11, §6, §8 step 10).
#
# Path-filtered: only runs when a prompt or behavior config file changes,
# and gates the merge on the deterministic + injection eval subset (cheap,
# local-model-only -- no LLM-judge, no cost-incurring calls, §3.11's "CI
# gate" bullet). Cost-incurring LLM-judged eval stays a manual, non-gating
# run (`make eval`, or `uv run pytest tests/eval -m eval`) -- that's why
# `-m "not eval"` below, not a bare `pytest tests/eval`: it excludes
# `backend/tests/eval/test_scenario_eval.py` and `test_routing_eval.py`
# (both marked `eval`, both call a real LLM) and runs exactly
# `test_retrieval_eval.py` (golden query set against the zero-dependency
# fixture corpus) and `test_injection_redteam.py` (the deterministic
# denylist rail, no guard-model call) -- the actual deterministic +
# injection packs landed in BLUEPRINT.md §8 step 10.

name: Eval gate

on:
  pull_request:
    paths:
      - "backend/config/prompts/**"
      - "backend/config/behavior/**"

concurrency:
  group: eval-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: Deterministic + injection eval subset
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies (locked)
        run: uv sync --locked

      - name: Run deterministic + injection eval subset
        run: uv run pytest tests/eval -m "not eval" -v
