# Cairn — build + push images to ghcr.io (BLUEPRINT.md §6, §8 step 9).
#
# Both `backend/Dockerfile` and `frontend/Dockerfile` are already
# multi-stage (builder + slim runtime, §8 steps 2/8); this workflow just
# builds and pushes each on `main` and on version tags. Registry-agnostic
# by design (BLUEPRINT.md §6) -- ghcr.io here because it needs no extra
# account/secret beyond the repo's own `GITHUB_TOKEN`, but the images
# themselves are portable to any registry/deploy target.

name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & push (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v5

      - name: Lowercase repository name (ghcr.io image refs must be lowercase)
        run: echo "REPO_LC=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ env.REPO_LC }}/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
